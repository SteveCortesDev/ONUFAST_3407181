<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>ONUFAST - Consulta Multitabla</title>

  <link
    rel="stylesheet"
    href="./css/estilos.css"
  />
</head>

<body>

  <header>
    <h1>ONUFAST</h1>

    <p>
      Demostrativo de consulta multitabla
    </p>
  </header>

  <main>

    <!-- RESUMEN -->
    <section
      id="resumen"
      class="resumen"
    ></section>


    <!-- CONSULTA MULTITABLA -->
    <section>

      <div class="titulo-seccion">
        <h2>Consulta multitabla</h2>

        <p>
          Información relacionada de usuarios,
          envíos, rutas, paquetes y facturación.
        </p>
      </div>

      <div
        id="envios"
        class="envios"
      ></div>

    </section>


    <!-- DETALLES -->
    <section>

      <div class="titulo-seccion">
        <h2>Detalle de envíos</h2>

        <p>
          Información obtenida mediante las
          relaciones entre las tablas.
        </p>
      </div>

      <div
        id="detalles"
        class="detalles"
      ></div>

    </section>

  </main>


  <script
    type="module"
    src="./js/app.js"
  ></script>

</body>

</html>
